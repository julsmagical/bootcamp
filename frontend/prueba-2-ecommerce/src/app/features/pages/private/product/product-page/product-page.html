<div class="page-container">
  <div class="page-header">
    <h2>Catálogo de Productos</h2>
    <button mat-flat-button class="add-btn" (click)="openDialog()">
      <mat-icon>add</mat-icon>
      <span>Nuevo Producto</span>
    </button>
  </div>

  <div class="filters-container">
    <mat-form-field appearance="outline" class="search-field">
      <input matInput [formControl]="searchControl">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
  </div>

  <div class="table-wrapper mat-elevation-z1">
    <table mat-table [dataSource]="filteredProducts()">

      <ng-container matColumnDef="image">
        <th mat-header-cell *matHeaderCellDef>Imagen</th>
        <td mat-cell *matCellDef="let product">
          <img [src]="product.thumbnail || 'assets/images/placeholder.jpg'" alt="Preview" class="product-img-thumb">
        </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Producto</th>
        <td mat-cell *matCellDef="let product">
          <div class="product-info-cell">
            <span class="p-name">{{ product.title }}</span>
            <span class="p-desc">{{ product.description }}</span>
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="price">
        <th mat-header-cell *matHeaderCellDef>Precio</th>
        <td mat-cell *matCellDef="let product">${{ product.price }}</td>
      </ng-container>

      <ng-container matColumnDef="category">
        <th mat-header-cell *matHeaderCellDef>Categoría</th>
        <td mat-cell *matCellDef="let product">{{ product.category }}</td>
      </ng-container>

      <ng-container matColumnDef="stock">
        <th mat-header-cell *matHeaderCellDef>Stock</th>
        <td mat-cell *matCellDef="let product">{{ product.stock }} u.</td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let product">
          <div class="actions-cell">
            <button mat-icon-button class="edit-btn" (click)="openDialog(product)">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button class="delete-btn" (click)="deleteProduct(product.id)">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
    </table>
  </div>
</div>
