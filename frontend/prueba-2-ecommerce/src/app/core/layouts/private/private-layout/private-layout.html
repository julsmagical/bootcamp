<div class="admin-container">
  <!-- sidebar -->
  <aside class="sidebar" [class.collapsed]="collapsed()">
    <div class="sidebar-header">
      <mat-icon class="brand-icon">storefront</mat-icon>
      @if (!collapsed()) {
        <span class="brand-name">NovaAdmin</span>
      }
    </div>

    <mat-nav-list>
      @for (item of navItems; track item.route) {
        <a mat-list-item [routerLink]="item.route" routerLinkActive="active-nav" [routerLinkActiveOptions]="{ exact: true }"
           [matTooltip]="collapsed() ? item.label : ''" matTooltipPosition="right">
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          @if (!collapsed()) {
            <span matListItemTitle>{{ item.label }}</span>
          }
        </a>
      }
    </mat-nav-list>
  </aside>

  <div class="main-wrapper">
    <!--el topbar -->
    <mat-toolbar class="topbar mat-elevation-z1">
      <button mat-icon-button (click)="toggle()">
        <mat-icon>{{ collapsed() ? 'menu' : 'menu_open' }}</mat-icon>
      </button>

      <span class="spacer"></span>
      <!--info del usuario y logout-->
      <div class="user-info-container">
        <div class="user-details">
          <span class="user-name">{{ username() || 'Administrador' }}</span>
          <span class="user-role">Panel de Control</span>
        </div>
        <button mat-icon-button class="logout-btn" (click)="logout()" matTooltip="Cerrar Sesión">
          <mat-icon>logout</mat-icon>
        </button>
      </div>
    </mat-toolbar>
    <main class="content-area">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
