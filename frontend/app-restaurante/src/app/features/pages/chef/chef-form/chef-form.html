<h2 mat-dialog-title class="title">
  {{ isEdit() ? 'Editar chef' : 'Nuevo chef' }}
</h2>

<form [formGroup]="form" class="form">
  <mat-dialog-content class="form-content">

    <mat-form-field appearance="outline" class="field">
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="name">
      <mat-error>{{ errorMessage('name') }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="field">
      <mat-label>País</mat-label>
      <input matInput formControlName="country">
      <mat-error>{{ errorMessage('country') }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="field">
      <mat-label>Ciudad</mat-label>
      <input matInput formControlName="city">
      <mat-error>{{ errorMessage('city') }}</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" class="field">
      <mat-label>Género</mat-label>
      <mat-select formControlName="gender">
        <mat-option value="male">Male</mat-option>
        <mat-option value="female">Female</mat-option>
      </mat-select>
      <mat-error>{{ errorMessage('gender') }}</mat-error>
    </mat-form-field>

  </mat-dialog-content>

  <mat-dialog-actions class="actions">
    <button mat-button type="button" (click)="dialogRef.close()">Cancelar</button>
    <button mat-flat-button type="submit" class="save-btn" (click)="guardar()" [disabled]="form.invalid || loading()">Guardar</button>
  </mat-dialog-actions>
</form>
